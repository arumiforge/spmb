name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli, gd, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check
        run: find app tests public -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Coding standard
        run: composer lint

  test:
    name: Tests (PHP ${{ matrix.php }}, MySQL 8.0)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spmb_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, mysqli, gd, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure test environment
        run: |
          cat > .env <<'EOF'
          CI_ENVIRONMENT = testing
          database.tests.hostname = 127.0.0.1
          database.tests.database = spmb_test
          database.tests.username = root
          database.tests.password = root
          database.tests.DBDriver = MySQLi
          database.tests.port = 3306
          database.tests.charset = utf8mb4
          database.tests.DBCollat = utf8mb4_unicode_ci
          EOF

      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage

  assets:
    name: Frontend build
    runs-on: ubuntu-24.04
    if: ${{ hashFiles('package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
