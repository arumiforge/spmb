name: Commit policy

# Arumi Studios is the sole contributor. Rejects commits that are authored by
# anyone else or that carry AI attribution trailers.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi

          allowed_author='^(arumiforge@gmail\.com|[0-9]+\+arumiforge@users\.noreply\.github\.com|arumiforge@users\.noreply\.github\.com)$'
          allowed_committer='^(arumiforge@gmail\.com|[0-9]+\+arumiforge@users\.noreply\.github\.com|arumiforge@users\.noreply\.github\.com|noreply@github\.com)$'
          forbidden='^(co-authored-by:|claude-session:)|generated with \[?claude|claude\.ai/code|noreply@anthropic\.com'

          fail=0
          for c in $(git rev-list "$range"); do
            ae=$(git show -s --format='%ae' "$c")
            ce=$(git show -s --format='%ce' "$c")
            subject=$(git show -s --format='%h %s' "$c")
            if ! [[ "$ae" =~ $allowed_author ]]; then
              echo "::error::$subject — author <$ae> is not Arumi Studios"; fail=1
            fi
            if ! [[ "$ce" =~ $allowed_committer ]]; then
              echo "::error::$subject — committer <$ce> is not Arumi Studios"; fail=1
            fi
            if git show -s --format='%B' "$c" | grep -qiE "$forbidden"; then
              echo "::error::$subject — contains a co-author or AI attribution line"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "All commits in $range comply."
          exit "$fail"
