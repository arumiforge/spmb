name: Deploy

# Manual, release-based deploy to Ubuntu 24.04 over SSH through Cloudflare
# Tunnel (Cloudflare Access service token). The server needs no inbound ports
# and no GitHub access. Setup: docs/deployment.md.
#
# Environment "production" (Settings → Environments) must define:
#   secrets: SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
#   vars:    SSH_HOST (Access-protected SSH hostname), SSH_USER, DEPLOY_PATH (e.g. /var/www/spmb)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy
        default: main
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check configuration
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          HAS_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
          HAS_CF: ${{ secrets.CF_ACCESS_CLIENT_ID != '' && secrets.CF_ACCESS_CLIENT_SECRET != '' }}
        run: |
          missing=""
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          [ -n "$DEPLOY_PATH" ] || missing="$missing DEPLOY_PATH"
          [ "$HAS_KEY" = "true" ] || missing="$missing SSH_PRIVATE_KEY"
          [ "$HAS_CF" = "true" ] || missing="$missing CF_ACCESS_CLIENT_ID/SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Production environment is not configured. Missing:$missing (see docs/deployment.md)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli, gd, zip
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci && npm run build

      - name: Package release
        run: |
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./flowbite' \
              --exclude='./ai' --exclude='./tests' --exclude='./writable' --exclude='./.env' \
              -czf "/tmp/$RELEASE.tar.gz" .

      - name: Configure SSH via Cloudflare Access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl -fsSL -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host spmb-prod
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyCommand cloudflared access ssh --hostname %h --id $CF_ID --secret $CF_SECRET
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload and activate release
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh spmb-prod "mkdir -p '$DEPLOY_PATH/releases/$RELEASE'"
          scp "/tmp/$RELEASE.tar.gz" "spmb-prod:$DEPLOY_PATH/releases/$RELEASE.tar.gz"
          ssh spmb-prod "tar -xzf '$DEPLOY_PATH/releases/$RELEASE.tar.gz' -C '$DEPLOY_PATH/releases/$RELEASE' \
            && rm '$DEPLOY_PATH/releases/$RELEASE.tar.gz' \
            && bash '$DEPLOY_PATH/releases/$RELEASE/deploy/activate.sh' '$DEPLOY_PATH' '$RELEASE'"
