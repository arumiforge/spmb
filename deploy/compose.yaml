# SPMB stack: one per environment (spmb-staging, spmb-production) on the same server (D-066, D-067).
#
# Not started by hand: `spmb deploy <env>` copies this file from the deployed commit into
# /opt/apps/spmb/<env>/compose.yaml and runs
#   docker compose -p spmb-<env> --env-file stack.env -f compose.yaml up -d
# from that folder. stack.env (made by `spmb init`) sets every ${…} below; app.env is the
# CodeIgniter .env of this environment. Only the web port is published, on 127.0.0.1;
# cloudflared on the host forwards the public hostname to it.

name: spmb-${SPMB_ENV:?SPMB_ENV is not set}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${SPMB_DB_BUFFER_POOL:-256M}
      - --max-connections=60
      - --skip-name-resolve
    environment:
      MYSQL_DATABASE: spmb
      MYSQL_USER: spmb
      MYSQL_PASSWORD: ${SPMB_DB_PASSWORD:?SPMB_DB_PASSWORD is not set}
      MYSQL_ROOT_PASSWORD: ${SPMB_DB_ROOT_PASSWORD:?SPMB_DB_ROOT_PASSWORD is not set}
      TZ: Asia/Jakarta
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *logging

  app:
    image: spmb-app:${SPMB_TAG:?SPMB_TAG is not set}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./app.env:/var/www/html/.env:ro
      - writable:/var/www/html/writable
    logging: *logging

  web:
    image: spmb-web:${SPMB_TAG}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "127.0.0.1:${SPMB_PORT:?SPMB_PORT is not set}:80"
    logging: *logging

volumes:
  db:
  writable:
