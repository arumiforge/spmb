; SPMB PHP-FPM pool overrides (loaded after www.conf and docker.conf).
[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 9000
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
request_terminate_timeout = 120s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
