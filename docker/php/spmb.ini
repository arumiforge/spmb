; SPMB production PHP settings (on top of php.ini-production).
; Upload limits match Berkas.imageUploadLimitKb: phone photos are 3–8 MB (D-043).
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60
expose_php = Off
date.timezone = Asia/Jakarta
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
session.cookie_httponly = 1

; OPcache: code only changes with a new image, so timestamps are not checked.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
realpath_cache_size = 4096K
realpath_cache_ttl = 600
