# SPMB site. Traffic arrives from cloudflared on the host through 127.0.0.1:<port> (the only
# published port), so the client address Nginx sees is the Docker bridge gateway or loopback.

# Real visitor IP from Cloudflare (only the host can reach this port, so the header is trusted).
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

# Cloudflare ends TLS; tell PHP the request was HTTPS when the edge says so.
map $http_x_forwarded_proto $spmb_https {
    https   on;
    default "";
}

# Docker's DNS: resolve `app` per request, so Nginx starts without it and follows a recreated
# app container (new IP) without a reload.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Upload limit: php post_max_size is 12M (phone photos, D-043).
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Container health check (Docker); does not touch PHP or the database.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Dotfiles (.env, .git, .htaccess) are never served; .well-known stays reachable.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Built assets carry ?v=<mtime> (ui_helper), so they can be cached for a year.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        # Images; most carry ?v=<mtime>, but not all, so a week instead of a year.
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller runs PHP; any other .php path is refused.
    location = /index.php {
        set $spmb_php app:9000;
        fastcgi_pass $spmb_php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $spmb_https if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }
}
