<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:Inter,'DejaVu Sans',sans-serif;overflow:hidden;

.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px);background-size:26px 26px}

.wrap{position:relative;display:flex;align-items:center;gap:56px;padding:0 80px;height:600px}
.logo{width:300px;height:300px;flex:none;filter:drop-shadow(0 12px 24px rgba(0,0,0,.35))}
.kicker{display:inline-block;background:#f5c400;color:#123d1f;font-weight:800;font-size:21px;letter-spacing:.04em;text-transform:uppercase;padding:8px 16px;border-radius:10px}

.year{font-size:32px;font-weight:600;color:#e8f3ec}
.url{margin-top:30px;font-size:26px;font-weight:600;color:#f5c400}
.partner{position:absolute;right:48px;bottom:36px;display:flex;align-items:center;gap:14px;font-size:18px;color:#d7eadd}
.partner img{height:54px;border-radius:6px}
</style></head><body><div class="dots"></div>
